[project]
name = "womens-volleyball"
version = "0.1.0"
description = "Scraper and cleaned dataset for NCAA women's volleyball rosters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "requests>=2.32.5",
    "tldextract>=5.3.0",
    "lxml-html-clean>=0.4.3",
    "shot-scraper>=1.8",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
