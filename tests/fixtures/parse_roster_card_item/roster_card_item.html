<!doctype html>
<html>
<body>
<!-- Nuxt roster-card-item layout: Penn State, … -->
<div class="roster-players-cards">
  <div class="roster-card-item">
    <div class="roster-card-item__thumb">
      <a class="roster-card-item__image-wrapper" href="/sports/womens-volleyball/roster/player/kendall-northern">
        <img alt="Kendall Northern" src="" loading="lazy"/>
      </a>
      <strong class="roster-card-jersey-number roster-card-item__jersey-number">#1</strong>
    </div>
    <div class="roster-card-item__info">
      <div class="roster-card-item__heading">
        <h3 class="roster-card-item__title">
          <a class="roster-card-item__title-link" href="/sports/womens-volleyball/roster/player/kendall-northern">Kendall Northern</a>
        </h3>
        <div class="roster-card-item__position">MB</div>
      </div>
      <div class="roster-players-cards-item__profile-fields-wrapper">
        <div class="roster-profile-fields-group roster-players-cards-item__profile-fields">
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Height</strong>
            <span class="profile-field-content__value">6′1″</span>
          </span>
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Class</strong>
            <span class="profile-field-content__value">Freshman</span>
          </span>
        </div>
        <div class="roster-profile-fields-group roster-players-cards-item__profile-fields">
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Hometown</strong>
            <span class="profile-field-content__value">Cincinnati, Ohio</span>
          </span>
          <span class="profile-field-content">
            <strong class="profile-field-content__title">High School</strong>
            <span class="profile-field-content__value">Summit Country Day School</span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="roster-card-item">
    <div class="roster-card-item__thumb">
      <a class="roster-card-item__image-wrapper" href="/sports/womens-volleyball/roster/player/ava-falduto">
        <img alt="Ava Falduto" src="" loading="lazy"/>
      </a>
      <strong class="roster-card-jersey-number roster-card-item__jersey-number">#2</strong>
    </div>
    <div class="roster-card-item__info">
      <div class="roster-card-item__heading">
        <h3 class="roster-card-item__title">
          <a class="roster-card-item__title-link" href="/sports/womens-volleyball/roster/player/ava-falduto">Ava Falduto</a>
        </h3>
        <div class="roster-card-item__position">L/DS</div>
      </div>
      <div class="roster-players-cards-item__profile-fields-wrapper">
        <div class="roster-profile-fields-group roster-players-cards-item__profile-fields">
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Height</strong>
            <span class="profile-field-content__value">5′7″</span>
          </span>
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Class</strong>
            <span class="profile-field-content__value">Junior</span>
          </span>
        </div>
        <div class="roster-profile-fields-group roster-players-cards-item__profile-fields">
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Hometown</strong>
            <span class="profile-field-content__value">Elmhurst, Ill.</span>
          </span>
          <span class="profile-field-content">
            <strong class="profile-field-content__title">High School</strong>
            <span class="profile-field-content__value">IC Catholic Prep</span>
          </span>
          <span class="profile-field-content">
            <strong class="profile-field-content__title">Previous School</strong>
            <span class="profile-field-content__value">Ohio State</span>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
